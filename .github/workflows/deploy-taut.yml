# Deploys only the Taut site. Independent from the Karuba workflow.
name: Deploy Taut (Live)

on:
  push:
    branches: [main]
    paths:
      - 'taut/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-taut.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build Taut
        run: bun install && bun run build
        working-directory: ./taut

      - name: Deploy Taut to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DECRYPTOR_GAME }}'
          projectId: decryptor-game
          target: taut
          channelId: live
