# Deploys only the Karuba site. Independent from the Taut workflow.
name: Deploy Karuba (Live)

on:
  push:
    branches: [main]
    paths:
      - 'karuba-online/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-karuba.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build Karuba
        run: bun install && bun run build
        working-directory: ./karuba-online

      - name: Deploy Karuba to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DECRYPTOR_GAME }}'
          projectId: decryptor-game
          target: karuba
          channelId: live
